server:
  port: 8080

spring:
  application:
    name: employee-management
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/employee_db}
  thymeleaf:
    cache: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m
    cache-names:
      - employees
      - employeeById

logging:
  level:
    org.springframework.security: INFO
    com.example.employeemanagement: DEBUG

app:
  admin:
    username: admin
    password: admin123
    email: admin@company.com