<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${employee.name} + ' - Employee Profile - StaffHub'"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVIGATION BAR -->
<nav class="navbar">
    <div style="display:flex; align-items:center; gap:32px;">
        <a th:href="@{/employees}" class="nav-brand">
            <div class="nav-brand-icon">
                <i class="bi bi-people-fill"></i>
            </div>
            <span>StaffHub</span>
        </a>
        <div class="nav-links">
            <a th:href="@{/employees}" class="nav-link active">
                <i class="bi bi-person-lines-fill"></i>
                <span>Employees</span>
            </a>
            <a th:href="@{/admin/users}" class="nav-link" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-shield-lock-fill"></i>
                <span>Manage Users</span>
            </a>
        </div>
    </div>

    <div class="nav-user">
        <a th:href="@{/employees}" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
            <span>Back to Directory</span>
        </a>
    </div>
</nav>

<!-- MAIN CONTENT -->
<main class="container">
    <div class="card profile-card">
        <!-- PROFILE HERO -->
        <div class="profile-hero">
            <div class="profile-avatar-lg" th:attr="data-avatar-name=${employee.name}">E</div>
            <div style="flex:1;">
                <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px;">
                    <h1 th:text="${employee.name}" style="font-size:1.75rem; font-weight:800; color:var(--dark);"></h1>
                    <span th:if="${employee.active}" class="badge badge-active">
                        <span class="badge-dot"></span> Active
                    </span>
                    <span th:unless="${employee.active}" class="badge badge-inactive">
                        <span class="badge-dot"></span> Inactive
                    </span>
                </div>
                <div style="display:flex; align-items:center; gap:12px; color:var(--text-muted); font-size:0.95rem;">
                    <span style="font-weight:600; color:var(--primary);" th:text="${employee.designation}"></span>
                    <span>&bull;</span>
                    <span class="badge badge-dept" th:text="${employee.department}"></span>
                </div>
            </div>
        </div>

        <!-- DETAILS GRID -->
        <div class="profile-details-grid">
            <div class="detail-item">
                <span class="detail-label"><i class="bi bi-envelope"></i> Email Address</span>
                <span class="detail-value" th:text="${employee.email}"></span>
            </div>
            <div class="detail-item">
                <span class="detail-label"><i class="bi bi-telephone"></i> Phone Number</span>
                <span class="detail-value" th:text="${employee.phone != null and !employee.phone.isEmpty() ? employee.phone : 'Not provided'}"></span>
            </div>
            <div class="detail-item">
                <span class="detail-label"><i class="bi bi-building"></i> Department</span>
                <span class="detail-value" th:text="${employee.department}"></span>
            </div>
            <div class="detail-item">
                <span class="detail-label"><i class="bi bi-award"></i> Designation</span>
                <span class="detail-value" th:text="${employee.designation}"></span>
            </div>
            <div class="detail-item">
                <span class="detail-label"><i class="bi bi-currency-dollar"></i> Compensation / Salary</span>
                <span class="detail-value salary-tag" style="font-size:1.15rem; color:#0f172a;" th:text="${'$' + employee.salary}"></span>
            </div>
            <div class="detail-item">
                <span class="detail-label"><i class="bi bi-calendar3"></i> Date of Joining</span>
                <span class="detail-value" th:text="${employee.joiningDate != null ? employee.joiningDate : 'N/A'}"></span>
            </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="form-actions" style="margin-top:28px;">
            <a th:href="@{/employees/edit/{id}(id=${employee.id})}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-pencil-square"></i>
                <span>Edit Profile</span>
            </a>
            <a th:href="@{/employees}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i>
                <span>Back to Directory</span>
            </a>
        </div>
    </div>
</main>

<footer class="app-footer">
    StaffHub &copy; Employee Management System &bull; Designed for high performance teams
</footer>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
