<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Employee - StaffHub' : 'Add Employee - StaffHub'"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVIGATION BAR -->
<nav class="navbar">
    <div style="display:flex; align-items:center; gap:32px;">
        <a th:href="@{/employees}" class="nav-brand">
            <div class="nav-brand-icon">
                <i class="bi bi-people-fill"></i>
            </div>
            <span>StaffHub</span>
        </a>
        <div class="nav-links">
            <a th:href="@{/employees}" class="nav-link active">
                <i class="bi bi-person-lines-fill"></i>
                <span>Employees</span>
            </a>
            <a th:href="@{/admin/users}" class="nav-link" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-shield-lock-fill"></i>
                <span>Manage Users</span>
            </a>
        </div>
    </div>

    <div class="nav-user">
        <a th:href="@{/employees}" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
            <span>Back to Directory</span>
        </a>
    </div>
</nav>

<!-- MAIN CONTENT -->
<main class="container">
    <div class="card form-card">
        <div class="page-title-group" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="stat-icon primary" style="width:42px; height:42px; font-size:1.2rem;">
                    <i th:class="${isEdit} ? 'bi bi-pencil-square' : 'bi bi-person-plus'"></i>
                </div>
                <div>
                    <h1 th:text="${isEdit} ? 'Edit Employee Details' : 'Add New Employee'" style="font-size:1.45rem;"></h1>
                    <p class="page-subtitle" th:text="${isEdit} ? 'Update existing personnel record in the system' : 'Create a new employee profile in your directory'"></p>
                </div>
            </div>
        </div>

        <!-- ERROR ALERT -->
        <div class="alert alert-error" th:if="${errorMessage}">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="${isEdit} ? @{/employees/edit/{id}(id=${employee.id})} : @{/employees}"
              th:object="${employee}" method="post">

            <div class="form-grid">
                <!-- FULL NAME -->
                <div class="form-group">
                    <label><i class="bi bi-person"></i> Full Name <span style="color:#ef4444;">*</span></label>
                    <input type="text" th:field="*{name}" placeholder="e.g. John Doe">
                    <div class="error-text" th:if="${#fields.hasErrors('name')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{name}"></span>
                    </div>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label><i class="bi bi-envelope"></i> Email Address <span style="color:#ef4444;">*</span></label>
                    <input type="email" th:field="*{email}" placeholder="john.doe@company.com">
                    <div class="error-text" th:if="${#fields.hasErrors('email')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <!-- PHONE -->
                <div class="form-group">
                    <label><i class="bi bi-telephone"></i> Contact Phone</label>
                    <input type="text" th:field="*{phone}" placeholder="e.g. +880 1712 345678">
                    <div class="error-text" th:if="${#fields.hasErrors('phone')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{phone}"></span>
                    </div>
                </div>

                <!-- DEPARTMENT -->
                <div class="form-group">
                    <label><i class="bi bi-building"></i> Department <span style="color:#ef4444;">*</span></label>
                    <input type="text" th:field="*{department}" placeholder="e.g. Engineering, Sales, HR">
                    <div class="error-text" th:if="${#fields.hasErrors('department')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{department}"></span>
                    </div>
                </div>

                <!-- DESIGNATION -->
                <div class="form-group">
                    <label><i class="bi bi-award"></i> Job Designation <span style="color:#ef4444;">*</span></label>
                    <input type="text" th:field="*{designation}" placeholder="e.g. Senior Software Engineer">
                    <div class="error-text" th:if="${#fields.hasErrors('designation')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{designation}"></span>
                    </div>
                </div>

                <!-- SALARY -->
                <div class="form-group">
                    <label><i class="bi bi-currency-dollar"></i> Salary (USD) <span style="color:#ef4444;">*</span></label>
                    <input type="number" step="0.01" th:field="*{salary}" placeholder="e.g. 75000.00">
                    <div class="error-text" th:if="${#fields.hasErrors('salary')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{salary}"></span>
                    </div>
                </div>

                <!-- JOINING DATE -->
                <div class="form-group">
                    <label><i class="bi bi-calendar-event"></i> Joining Date <span style="color:#ef4444;">*</span></label>
                    <input type="date" th:field="*{joiningDate}">
                    <div class="error-text" th:if="${#fields.hasErrors('joiningDate')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{joiningDate}"></span>
                    </div>
                </div>

                <!-- ACTIVE STATUS TOGGLE -->
                <div class="form-group" style="justify-content: flex-end;">
                    <label><i class="bi bi-toggle-on"></i> Employment Status</label>
                    <label class="switch-label">
                        <input type="checkbox" th:field="*{active}" class="switch-input">
                        <span class="switch-slider"></span>
                        <span>Active Employee</span>
                    </label>
                </div>
            </div>

            <!-- BUTTON ACTIONS -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i>
                    <span th:text="${isEdit} ? 'Update Employee' : 'Save Employee'"></span>
                </button>
                <a th:href="@{/employees}" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i>
                    <span>Cancel</span>
                </a>
            </div>
        </form>
    </div>
</main>

<footer class="app-footer">
    StaffHub &copy; Employee Management System &bull; Designed for high performance teams
</footer>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
