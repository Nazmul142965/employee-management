<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Employee Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">

<div class="login-card">
    <div class="login-header">
        <div class="login-logo">
            <i class="bi bi-people-fill"></i>
        </div>
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Sign in to your StaffHub workspace</p>
    </div>

    <!-- Error Alert -->
    <div class="alert alert-error" th:if="${param.error}">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>Invalid username or password. Please try again.</span>
    </div>

    <!-- Logout Alert -->
    <div class="alert alert-success" th:if="${param.logout}">
        <i class="bi bi-check-circle-fill"></i>
        <span>You have been safely logged out.</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group" style="margin-bottom: 18px;">
            <label><i class="bi bi-person"></i> Username</label>
            <div class="input-with-icon">
                <i class="bi bi-person-fill"></i>
                <input type="text" name="username" placeholder="Enter username" required autofocus autocomplete="username">
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 22px;">
            <label><i class="bi bi-shield-lock"></i> Password</label>
            <div class="input-with-icon" style="position: relative;">
                <i class="bi bi-lock-fill"></i>
                <input type="password" name="password" id="passwordInput" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="password-toggle" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#94a3b8; cursor:pointer; font-size:1.05rem;" title="Toggle Password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem;">
            <span>Sign In</span>
            <i class="bi bi-arrow-right"></i>
        </button>
    </form>

    <div class="demo-credentials">
        <div style="font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; color:#1e293b;">
            <i class="bi bi-info-circle-fill" style="color:#4f46e5;"></i> Default Admin Credentials:
        </div>
        <div>Username: <span class="demo-badge">admin</span> Password: <span class="demo-badge">admin123</span></div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
