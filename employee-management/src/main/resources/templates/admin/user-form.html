<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User Account - StaffHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVIGATION BAR -->
<nav class="navbar">
    <div style="display:flex; align-items:center; gap:32px;">
        <a th:href="@{/employees}" class="nav-brand">
            <div class="nav-brand-icon">
                <i class="bi bi-people-fill"></i>
            </div>
            <span>StaffHub</span>
        </a>
        <div class="nav-links">
            <a th:href="@{/employees}" class="nav-link">
                <i class="bi bi-person-lines-fill"></i>
                <span>Employees</span>
            </a>
            <a th:href="@{/admin/users}" class="nav-link active" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-shield-lock-fill"></i>
                <span>Manage Users</span>
            </a>
        </div>
    </div>

    <div class="nav-user">
        <a th:href="@{/admin/users}" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
            <span>Back to Users</span>
        </a>
    </div>
</nav>

<!-- MAIN CONTENT -->
<main class="container">
    <div class="card form-card">
        <div class="page-title-group" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="stat-icon primary" style="width:42px; height:42px; font-size:1.2rem;">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <div>
                    <h1 style="font-size:1.45rem;">Create New User Account</h1>
                    <p class="page-subtitle">Configure system access credentials and security roles</p>
                </div>
            </div>
        </div>

        <!-- ERROR ALERT -->
        <div class="alert alert-error" th:if="${errorMessage}">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/admin/users}" th:object="${appUser}" method="post">
            <div class="form-grid">
                <!-- USERNAME -->
                <div class="form-group">
                    <label><i class="bi bi-person"></i> Username <span style="color:#ef4444;">*</span></label>
                    <input type="text" th:field="*{username}" placeholder="e.g. jsmith" autocomplete="username">
                    <div class="error-text" th:if="${#fields.hasErrors('username')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{username}"></span>
                    </div>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label><i class="bi bi-envelope"></i> Email Address <span style="color:#ef4444;">*</span></label>
                    <input type="email" th:field="*{email}" placeholder="jsmith@company.com">
                    <div class="error-text" th:if="${#fields.hasErrors('email')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label><i class="bi bi-shield-lock"></i> Temporary Password <span style="color:#ef4444;">*</span></label>
                    <div class="input-with-icon" style="position: relative;">
                        <input type="password" th:field="*{password}" placeholder="••••••••" autocomplete="new-password">
                        <button type="button" class="password-toggle" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#94a3b8; cursor:pointer; font-size:1.05rem;" title="Toggle Password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="error-text" th:if="${#fields.hasErrors('password')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{password}"></span>
                    </div>
                </div>

                <!-- ROLE CHOICE -->
                <div class="form-group">
                    <label><i class="bi bi-person-badge"></i> Assigned Role <span style="color:#ef4444;">*</span></label>
                    <select name="roleChoice">
                        <option value="USER">Standard User (View Only)</option>
                        <option value="ADMIN">Administrator (Full Access)</option>
                    </select>
                </div>
            </div>

            <!-- BUTTON ACTIONS -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-person-check-fill"></i>
                    <span>Create User</span>
                </button>
                <a th:href="@{/admin/users}" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i>
                    <span>Cancel</span>
                </a>
            </div>
        </form>
    </div>
</main>

<footer class="app-footer">
    StaffHub &copy; Employee Management System &bull; Designed for high performance teams
</footer>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
