<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - StaffHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center;">

<div class="card error-card">
    <div class="error-icon-wrap warning">
        <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a; margin-bottom: 8px;">Access Denied (403)</h1>
    <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 24px; line-height: 1.6;">
        You don't have sufficient administrator permissions to view or perform operations on this page.
    </p>
    <div>
        <a th:href="@{/employees}" class="btn btn-primary" style="padding: 10px 24px;">
            <i class="bi bi-arrow-left"></i>
            <span>Return to Employees</span>
        </a>
    </div>
</div>

</body>
</html>
